task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox']

num_classes: 5
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: F:/Data/Small_fetting_defect/patch/smoke_valley_1280_coco/train
    ann_file: F:/Data/Small_fetting_defect/patch/smoke_valley_1280_coco/train/_annotations.coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 4
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: F:/Data/Small_fetting_defect/patch/smoke_valley_1280_coco/valid
    ann_file: F:/Data/Small_fetting_defect/patch/smoke_valley_1280_coco/valid/_annotations.coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 4
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
