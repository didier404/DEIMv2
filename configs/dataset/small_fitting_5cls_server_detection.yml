task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 5
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/a100/workspace/zd/sci/xjj/data/rfdetr_dataset/train
    ann_file: /media/a100/workspace/zd/sci/xjj/data/rfdetr_dataset/train/_annotations.coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 2
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: /media/a100/workspace/zd/sci/xjj/data/rfdetr_dataset/valid
    ann_file: /media/a100/workspace/zd/sci/xjj/data/rfdetr_dataset/valid/_annotations.coco.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 2
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
