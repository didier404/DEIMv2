task: detection

evaluator:
  type: CocoEvaluator
  iou_types: ['bbox', ]

num_classes: 5
remap_mscoco_category: False

train_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: G:/Data/Small_fetting_defect/data
    ann_file: G:/Data/Small_fetting_defect/data/DEIMv2/smoke_annotations/instances_train_smoke.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: True
  num_workers: 0
  drop_last: True
  collate_fn:
    type: BatchImageCollateFunction

val_dataloader:
  type: DataLoader
  dataset:
    type: CocoDetection
    img_folder: G:/Data/Small_fetting_defect/data
    ann_file: G:/Data/Small_fetting_defect/data/DEIMv2/smoke_annotations/instances_val_smoke.json
    return_masks: False
    transforms:
      type: Compose
      ops: ~
  shuffle: False
  num_workers: 0
  drop_last: False
  collate_fn:
    type: BatchImageCollateFunction
